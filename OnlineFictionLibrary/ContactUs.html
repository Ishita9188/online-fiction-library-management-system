<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact Us - FictionReads</title>
  <link rel="icon" type="image/png" href="logoFR2.png">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      height: 100%;
      font-family: Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(to right, #ce8d57, #383737);
      background-size: cover;
      overflow: hidden;
    }
    .logo-text {
  position: absolute;
  top: 20px;
  left: 30px;
  display: flex;
  align-items: center;
}

.logo-text img {
  height: 35px;
}

.logo-text h1 {
    color: #8f2917;
    display: flex;
  align-items: center;
  justify-content: center;
  font-size: 28px;
}

    form {
    max-width: 550px;
    margin: 60px auto 60px auto;
    background: rgba(0, 0, 0, 0.95);
    padding: 35px;
    border-radius: 12px;
    box-shadow: 0 0 15px rgba(0,0,0,0.3);
    color: white;
    animation: fadeIn 0.8s ease;
}

form h2 {
    text-align: center;
    margin-bottom: 25px;
    color: #8f2917;
    font-size: 28px;
}
form input,
form textarea,
form select {
    width: 100%;
    padding: 12px;
    margin-top: 10px;
    margin-bottom: 20px;
    border-radius: 6px;
    border: 2px solid #8f2917;
    background-color: #fff;
    color: #000;
    box-sizing: border-box;
    transition: all 0.3s ease;
}

form input:focus,
form textarea:focus,
form select:focus {
    outline: none;
    border-color: darkred;
    box-shadow: 0 0 8px rgba(139, 0, 0, 0.6);
    transform: scale(1.03);
}
.submit-btn {
    background-color: #8f2917;
    color: white;
    padding: 12px 20px;
    border: none;
    font-size: 16px;
    border-radius: 6px;
    cursor: pointer;
    display: block;
    margin: 0 auto;
    transition: background-color 0.3s, transform 0.2s;
}

.submit-btn:hover {
    background-color: darkred;
    transform: scale(1.05);
}
@keyframes fadeIn {
    from {
        opacity: 0;
        transform: translateY(-20px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}
@media (max-width: 768px) {
    .contact-container {
        margin: 120px 20px 60px 20px;
    }
}
  </style>
</head>
<body>
  <div class="logo-text">
    <h1>FictionReads</h1>
    <img src="logoFR2.png" alt="FictionReads Logo"> 
</div>
  <form id="contactForm">
    <h2>Contact Us</h2>
    <label for="subject">Subject:</label>
    <select name="subject" id="subject" required>
      <option>General Enquiry</option>
      <option>Technical Issue</option>
      <option>Author Enquiry</option>
    </select>
    <label for="firstname">First Name:</label>
    <input type="text" name="firstname" id="firstname">
    <label for="email">Email Address:</label>
    <input type="email" name="email" id="email">
    <label for="confirm-email">Confirm Email:</label>
    <input type="email" name="confirm_email" id="confirm-email">
    <label for="message">Message:</label>
    <textarea name="message" id="message"></textarea>
    <button class="submit-btn" type="submit">Submit Form</button>
  </form>
  <script>
    document.getElementById('contactForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      const firstName = document.getElementById('firstname').value.trim();
      const email = document.getElementById('email').value.trim();
      const confirmEmail = document.getElementById('confirm-email').value.trim();
      const nameRegex = /^[A-Za-z\s]+$/;
      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!subject || !firstName || !email || !confirmEmail || !message) {
        alert("Please fill out all fields before submitting.");
        return;
      }
      if (!firstName || !nameRegex.test(firstName)) {
        alert("Please enter a valid first name (letters and spaces only).");
        return;
      }
      if (!emailRegex.test(email)) {
        alert("Please enter a valid email address.");
        return;
      }
      if (email !== confirmEmail) {
        alert("Email and Confirm Email do not match.");
        return;
      }
      const formData = new FormData(this);
      const data = new URLSearchParams(formData);
      try {
        const res = await fetch('/submit-contact', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/x-www-form-urlencoded'
          },
          body: data
        });
  
        if (res.ok) {
          alert("Details stored successfully!");
          this.reset(); 
        } else {
          alert("Something went wrong. Please try again.");
        }
      } catch (error) {
        console.error('Error:', error);
        alert("Server error. Please try later.");
      }
    });
  </script>
    
</body>
</html>
