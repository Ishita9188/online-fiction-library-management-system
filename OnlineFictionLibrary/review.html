<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Write Review - FictionReads</title>
    <link rel="icon" type="image/png" href="logoFR2.png">
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: url('https://media.istockphoto.com/id/539686078/photo/shelves-full-of-books-library-background.jpg?s=612x612&w=0&k=20&c=lZJcOBHdlK9UVdvzIIIVCbkbIYo7kLpdn70odvQ9-tc=') no-repeat center center fixed;
            background-size: cover;
        }
        body::before {
    content: "";
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.6); 
    z-index: 0;
}


body > * {
    position: relative;
    z-index: 1;
}
select option {
    color: goldenrod; 
    background-color: rgb(255, 255, 255); 
}

        nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background-color: black;
            color: white;
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            box-sizing: border-box;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #8f2917;
        }

        .logout {
            background-color: #8f2917;
            color: white;
            padding: 10px 20px;
            border: none;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
            transition: 0.3s;
        }

        .logout:hover {
            background-color: darkred;
        }

        .review-form-container {
    max-width: 550px;
    margin: 120px auto 60px auto;
    background: rgba(0, 0, 0, 0.95);
    padding: 35px;
    border-radius: 12px;
    box-shadow: 0 0 15px rgba(0,0,0,0.3);
    color: white; 
    animation: fadeIn 0.8s ease;
}

.review-form-container h2 {
    text-align: center;
    margin-bottom: 25px;
    color: #8f2917;
}


.review-form-container input,
.review-form-container textarea,
.review-form-container select {
    width: 100%;
    padding: 12px;
    margin-top: 10px;
    margin-bottom: 20px;
    border-radius: 6px;
    border: 2px solid #8f2917; 
    box-sizing: border-box;
    color: rgb(0, 0, 0);
    background-color: rgb(255, 255, 255);
    transition: all 0.3s ease;
}


.review-form-container input:focus,
.review-form-container textarea:focus,
.review-form-container select:focus {
    outline: none;
    border-color: darkred;
    box-shadow: 0 0 8px rgba(139, 0, 0, 0.6);
    background-color: rgb(255, 255, 255);
    transform: scale(1.03); 
}


.review-form-container button {
    background-color: #8f2917;
    color: white;
    padding: 12px 20px;
    border: none;
    font-size: 16px;
    border-radius: 6px;
    cursor: pointer;
    display: block;
    margin: 0 auto;
    transition: background-color 0.3s, transform 0.2s;
}

.review-form-container button:hover {
    background-color: darkred;
    transform: scale(1.05);
}


@keyframes fadeIn {
    from {
        opacity: 0;
        transform: translateY(-20px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

        footer {
            background-color: #8f2917;
            padding: 30px 5%;
            margin-top: 40px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;
            box-sizing: border-box;
            padding-bottom: 80px;
        }

        .social-icons {
            display: flex;
            gap: 15px;
            flex: 1;
            
        }

        .social-icons img {
            width: 30px;
            height: 30px;
            object-fit: contain;
            transition: transform 0.3s ease, opacity 0.3s ease;
        }

        .social-icons img:hover {
            transform: scale(1.2);
            opacity: 0.8;
        }

        .footer-links {
            display: flex;
            gap: 80px;
            justify-content: center;
            flex: 2;
            
        }

        .footer-links h3 {
            color: white;
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .footer-links ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .footer-links ul li {
            margin-bottom: 6px;
        }

        .footer-links ul li a {
            color: white;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .footer-links ul li a:hover {
            color: #000000;
            text-decoration: underline;
        }
        footer .copyright {
    display: flex;
    align-items: center; 
    justify-content: center;
    color: rgb(255, 255, 255);
    font-size: 14px;
    padding: 10px;
}

        @media (max-width: 768px) {
            nav {
                flex-direction: column;
                align-items: flex-start;
                padding: 15px 20px;
            }

            .logout {
                margin-top: 10px;
            }

            .review-form-container {
                margin: 120px 20px 60px 20px;
            }

            footer {
        flex-direction: column;
        align-items: center;
        text-align: center;
    }

    .footer-links {
        flex-direction: column;
        gap: 20px;
        margin-top: 20px;
    }

    .copyright {
        margin-top: 20px;
        text-align: center;
    }
        }
    </style>
</head>
<body>
    <nav>
        <div class="logo">FictionReads</div>
        <a href="HomePage.html">
            <button class="logout">Logout</button>
        </a>
    </nav>

    <div class="review-form-container">
        <h2>Write a Review</h2>
        <form id="reviewForm" method="POST" action="/submit-review">
            <label for="reviewerName">Name:</label>
            <input type="text" id="reviewerName" name="name" readonly>

            <label for="reviewerEmail">Email:</label>
            <input type="email" id="reviewerEmail" name="email" readonly>

            <label for="bookTitle">Book Title:</label>
            <input type="text" id="bookTitle" name="title" readonly>

            <label for="rating">Rating:</label>
            <select id="rating" name="rating" required>
                <option value="">Select</option>
                <option value="1">★</option>
                <option value="2">★★</option>
                <option value="3">★★★</option>
                <option value="4">★★★★</option>
                <option value="5">★★★★★</option>
            </select>

            <label for="reviewText">Your Review:</label>
            <textarea id="reviewText" name="review" rows="5" required></textarea>

            <button type="submit">Submit Review</button>
        </form>
    </div>

    <footer>
        <div class="social-icons">
            <a href="https://twitter.com/" target="_blank">
                <img src="https://freepnglogo.com/images/all_img/1725374683twitter-x-logo.png" alt="Twitter">
            </a>
            <a href="https://instagram.com/" target="_blank">
                <img src="https://freepnglogo.com/images/1715963665instagram-logo-png-images.png" alt="Instagram">
            </a>
            <a href="https://facebook.com/" target="_blank">
                <img src="https://freepnglogo.com/images/all_img/1713419302Black_Facebook_PNG.png" alt="Facebook">
            </a>
            <a href="https://youtube.com/" target="_blank">
                <img src="https://freepnglogo.com/images/all_img/1701508739youtube-png.png" alt="YouTube">
            </a>
            <a href="https://tiktok.com/" target="_blank">
                <img src="https://freepnglogo.com/images/all_img/tik-tok-logo-transparent-031f.png" alt="TikTok">
            </a>
        </div>
        <div class="footer-links">
            <div class="resources">
                <h3>Quick Links</h3>
                <ul>
                    <li><a href="Vision.html">Vision</a></li>
                    <li><a href="Mission.html">Mission</a></li>
                    <li><a href="ContactUs.html">Contact Us</a></li>
                </ul>
            </div>
            <div class="resources">
                <h3>Library Info</h3>
                <ul>
                    <li><a href="Genres.html">Genres</a></li>
                    <li><a href="Authors.html">Authors</a></li>
                </ul>
            </div>
            <div class="policies">
                <h3>Policies</h3>
                <ul>
                    <li><a href="TermsOfUse.html">Terms of Use</a></li>
                    <li><a href="PrivacyPolicy.html">Privacy Policy</a></li>
                </ul>
            </div>
        </div>
        <div class="copyright">©️ 2025 FictionReads. All rights reserved.</div>
    </footer>
    <script>
        fetch('/user')
            .then(res => res.json())
            .then(data => {
                if (data.error) {
                    alert('You must log in first.');
                    window.location.href = '/login.html';
                } else {
                    document.querySelector('#reviewerName').value = data.name;
                    document.querySelector('#reviewerEmail').value = data.email;
    
                    const title = new URLSearchParams(window.location.search).get('title');
                    if (title) {
                        document.querySelector('#bookTitle').value = decodeURIComponent(title);
                    }
                }
            })
            .catch(err => {
                console.error('Failed to fetch user info:', err);
                alert('Something went wrong. Please try again.');
            });
    </script>
<script>
    document.getElementById('reviewForm').addEventListener('submit', function (e) {
        e.preventDefault();

        const formData = new FormData(this);
        const data = new URLSearchParams(formData);

        fetch('/submit-review', {
            method: 'POST',
            body: data
        })
        .then(response => response.json())
        .then(result => {
            alert(result.message);
            window.location.href = result.redirect;
        })
        .catch(error => {
            console.error('Error submitting review:', error);
            alert('Failed to submit review. Please try again.');
        });
    });
</script>
</body>
</html>
