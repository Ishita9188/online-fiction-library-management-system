<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mission - FictionReads</title>
    <link rel="icon" type="image/png" href="logoFR2.png">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #ce8d57, #383737);
            color: white;
        }
        .logo-text {
  position: absolute;
  top: 20px;
  left: 30px;
  display: flex;
  align-items: center;
}

.logo-text img {
  height: 35px;
  margin-left: 0;
  padding-left: 0;
}

.logo-text h1 {
    color: #8f2917;
    display: flex;
  align-items: center;
  justify-content: center;
  font-size: 28px;
  margin: 0;
  padding: 0;
}
        h1 {
            text-align: center;
            margin-top: 80px;
            font-size: 36px;
            color: #6e1e10;
        }

        .vision-box {
            max-width: 700px;
            margin: 40px auto;
            background-color: rgba(0, 0, 0, 0.85);
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 15px #702012;
            font-size: 18px;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="logo-text">
        <h1>FictionReads</h1>
        <img src="logoFR2.png" alt="FictionReads Logo"> 
    </div>
    <h1>Mission</h1>
    <div class="vision-box">
        FictionReads is dedicated to curating and delivering high-quality fiction literature in an accessible digital format.
        Through intuitive design and robust review features, we aim to support readers in discovering, enjoying, and evaluating fictional works with ease and clarity.
    </div>
</body>
</html>
