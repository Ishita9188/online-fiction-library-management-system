<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Genres - FictionReads</title>
    <link rel="icon" type="image/png" href="logoFR2.png">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #ce8d57, #383737);
            color: white;
        }
        .logo-text {
  position: absolute;
  top: 20px;
  left: 30px;
  display: flex;
  align-items: center;
}

.logo-text img {
  height: 35px;
  margin-left: 0;
  padding-left: 0;
}

.logo-text h1 {
    color: #8f2917;
    display: flex;
  align-items: center;
  justify-content: center;
  font-size: 28px;
  margin: 0;
  padding: 0;
}
        h1 {
            text-align: center;
            margin-top: 80px;
            font-size: 36px;
            color: #6e1e10;
        }

        .vision-box {
            max-width: 700px;
            margin: 40px auto;
            background-color: rgba(0, 0, 0, 0.85);
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 15px #702012;
            font-size: 18px;
            line-height: 1.6;
        }
        .vision-box ul {
            list-style-type: square;
            padding-left: 20px;
        }

        .vision-box li {
            margin: 12px 0;
            padding: 10px;
            background-color: rgba(255, 255, 255, 0.05);
            border-radius: 6px;
            transition: background-color 0.3s ease;
        }

        .vision-box li:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }

        .vision-box a {
            color: #ffcc99;
            text-decoration: none;
            font-weight: bold;
        }

        .vision-box a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="logo-text">
        <h1>FictionReads</h1>
        <img src="logoFR2.png" alt="FictionReads Logo"> 
    </div>
    <h1>Genres</h1>
    <div class="vision-box">
        <ul>
                <li><a href="#">Science Fiction</a></li>
                <li><a href="#">Mystery</a></li>
                <li><a href="#">Historical Fiction</a></li>
                <li><a href="#">Thriller</a></li>
                <li><a href="#">Horror</a></li>
                <li><a href="#">Romance</a></li>
        </ul>

    </div>
</body>
</html>
